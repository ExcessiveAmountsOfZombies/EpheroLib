plugins {
    id 'idea'
    id 'maven-publish'
    //id 'net.neoforged.moddev'
    //id 'org.spongepowered.mixin'
    id 'com.github.johnrengelman.shadow'
    id 'net.neoforged.gradle.userdev' version '7.0.145'
}

//apply plugin: 'org.spongepowered.mixin'

version = project.modVersion
group = project.mavenGroup
archivesBaseName = modBaseArchiveName + "-" + minecraftVersion + "-NEO-FORGE"

repositories {
    mavenLocal()
    maven { url = 'https://maven.neoforged.net/releases' }
    maven {
        url = 'https://maven.blamejared.com'
    }
}

configurations {
    shade
    compile.extendsFrom shade
    compileOnly.extendsFrom shade
    compileOnly.extendsFrom shadeSource
}

/*mixin {
    add sourceSets.main, "epherolib.refmap.json"
    config "epherolib.mixins.json"
}*/

sourceSets {
    main {
        java {
            srcDirs += [
                    rootProject.sourceSets.main.java
            ]
        }
        resources {
            srcDirs += [
                    "src/main/generated",
                    rootProject.sourceSets.main.resources
            ]
        }
    }
}

base {
    archivesName = archivesBaseName
}

processResources {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

minecraft.accessTransformers.file file('src/main/resources/META-INF/accesstransformer.cfg')

