dependencies {
    implementation "net.neoforged:neoforge:${neo_version}"
    //minecraft "net.minecraftforge:forge:${minecraftVersion}-${forgeVersion}"
    annotationProcessor "org.spongepowered:mixin:${mixinVersion}:processor"

    shade(rootProject)
    compileOnly(rootProject)
    implementation(rootProject)
}

shadowJar {
    archiveClassifier = ""
    enabled = true
    configurations = [project.configurations.shade]
    relocate("org.spongepowered.configurate", "com.epherical.epherolib.libs.org.spongepowered.configurate")
    relocate("com.typesafe", "com.epherical.epherolib.libs.com.typesafe")
    relocate("io.leangen", "com.epherical.epherolib.libs.io.leangen")
}

artifacts {
    archives shadowJar
    shadow shadowJar
}

jar {
    manifest {
        attributes([
                "Specification-Title": "Epherolib",
                "Specification-Vendor": "epherical.com",
                "Specification-Version": "1",
                "Implementation-Title": "${modBaseArchiveName}",
                "Implementation-Version": "${modVersion}",
                "Implementation-Vendor" :"epherical.com",
                "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"),
                "MixinConfigs": "epherolib.mixins.json"
        ])
    }
}

tasks.withType(JavaCompile) {
    options.encoding = "UTF-8"
    source(rootProject.sourceSets.main.allSource)
}

tasks.processResources.dependsOn(rootProject.tasks.processResources)
tasks.build.dependsOn(tasks.shadowJar)
tasks.compileJava.dependsOn(getRootProject().tasks.jar)

/*reobf {
    shadowJar {}
}*/

/*jar.finalizedBy('reobfJar')
shadowJar.dependsOn('reobfJar')*/

tasks.named("test").configure {
    enabled = false
}

task sourceJar(type: Jar) {
    archiveClassifier = 'sources'
    from sourceSets.main.allSource
}

// configure the maven publication
publishing {
    publications {
        mavenJava(MavenPublication) {
            artifactId = "${modBaseArchiveName}-" + artifactId
            version = version + "-${minecraftVersion}"
            // add all the jars that should be included when publishing to maven
            //from components.java
            artifact shadowJar

            artifact sourceJar
        }
    }

    repositories {
        maven {
            name = "EphericalMaven"
            url = "https://maven.epherical.com/releases"
            credentials {
                username = m_user
                password = m_pass
            }
        }
    }
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
